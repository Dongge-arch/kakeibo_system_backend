AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Home Kakeibo API on AWS Lambda

Parameters:
  HomeKakeiboLayerArn:
    Type: String
    Description: ARN of the uploaded Home Kakeibo dependency and application layer.
  KakeiboDatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string used by the Lambda functions.
  KakeiboDatabaseInitialize:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether Lambda should initialize PostgreSQL schema at startup.
  EnableScheduledAutoInput:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Disable the daily auto-input schedule in test environments.
  KakeiboJwtSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign login JWTs.
  KakeiboApiKey:
    Type: String
    NoEcho: true
    Description: API key required in x-api-key for application API requests.
  FrontendCorsOrigin:
    Type: String
    Default: "*"
    Description: Allowed frontend origin for API Gateway CORS, for example https://example.cloudfront.net.
  SupplierLogoBucketName:
    Type: String
    Default: ""
    Description: Optional S3 bucket name used to store supplier logos.

Conditions:
  HasSupplierLogoBucket: !Not [!Equals [!Ref SupplierLogoBucketName, ""]]
  ScheduledAutoInputEnabled: !Equals [!Ref EnableScheduledAutoInput, "true"]

Globals:
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - !Ref FrontendCorsOrigin
      AllowHeaders:
        - accept
        - authorization
        - cache-control
        - content-type
        - pragma
        - x-api-key
        - x-kakeibo-user-id
        - x-kakeibo-user-email
        - x-kakeibo-user-name
        - x-kakeibo-user-nickname
      AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures:
      - arm64
    Environment:
      Variables:
        KAKEIBO_DATABASE_TYPE: "postgresql"
        KAKEIBO_DATABASE_URL: !Ref KakeiboDatabaseUrl
        KAKEIBO_DATABASE_INITIALIZE: !Ref KakeiboDatabaseInitialize
        KAKEIBO_JWT_SECRET: !Ref KakeiboJwtSecret
        KAKEIBO_API_KEY: !Ref KakeiboApiKey
        FRONTEND_CORS_ORIGIN: !Ref FrontendCorsOrigin
        SUPPLIER_LOGO_S3_BUCKET: !Ref SupplierLogoBucketName
    Layers:
      - !Ref HomeKakeiboLayerArn

Resources:
  AutoInputScheduledFunction:
    Type: AWS::Serverless::Function
    Condition: ScheduledAutoInputEnabled
    Properties:
      FunctionName: home-kakeibo-auto-input-scheduled
      Handler: lambda_handler.lambda_handler
      CodeUri: dist_lambda/function/auto_input_scheduler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref AutoInputScheduledLogGroup
      Timeout: 900
      MemorySize: 1024
      Policies:
        - !If
          - HasSupplierLogoBucket
          - Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SupplierLogoBucketName}/*"
          - !Ref AWS::NoValue
      Events:
        DailyAutoInput:
          Type: Schedule
          Properties:
            Name: home-kakeibo-auto-input-daily
            Description: Run enabled BELC and ETC automatic imports every day.
            Schedule: cron(0 15 * * ? *)
            Enabled: !If [ScheduledAutoInputEnabled, true, false]

  ReceiptExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: home-kakeibo-receipt-export
      Handler: lambda_handler.lambda_handler
      CodeUri: dist_lambda/function/receipt_export
      LoggingConfig:
